[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartcopy"
version = "0.1.0"
description = "CTRL+A for developers - copy only source code, never dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyperclip>=1.8",
]

[project.scripts]
smartcopy = "smartcopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcopy"]

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]
