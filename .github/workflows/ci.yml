name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-cli:
    name: CLI tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install smartcopy + test deps
        run: pip install -e . pytest

      - name: Run CLI test suite
        run: pytest tests -q

  test-extension:
    name: Extension build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Compile TypeScript
        working-directory: extension
        run: npm run compile

      # The Electron test host needs a display server. Linux runners have
      # none by default, so it's launched under a virtual one via xvfb.
      - name: Run extension tests (Linux, headless)
        if: runner.os == 'Linux'
        working-directory: extension
        run: xvfb-run -a npm test

      - name: Run extension tests (Windows)
        if: runner.os == 'Windows'
        working-directory: extension
        run: npm test

      # @vscode/test-electron's downloaded VS Code build has a documented
      # history of failing to launch specifically on GitHub's macOS
      # runners (spawn ... Electron ENOENT) - tried explicit download +
      # xattr stripping first, no effect, so this is a real environment
      # limitation rather than something in our control. Linux and
      # Windows above already exercise the real activation test; macOS
      # instead verifies compile output actually packages into a valid
      # .vsix, which still catches real breakage (bad manifest, missing
      # files, TypeScript output problems) without depending on a flaky
      # Electron launch.
      - name: Verify the extension packages (macOS)
        if: runner.os == 'macOS'
        working-directory: extension
        run: npx @vscode/vsce package
